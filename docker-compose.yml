services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: sh -c "python manage.py wait_for_db &&
                    python manage.py migrate &&
                    python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./:/code
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "python manage.py wait_for_db && celery -A rick_and_morty_api worker -l info"
    volumes:
      - ./:/code
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    env_file:
      - .env

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "python manage.py wait_for_db &&
                    python manage.py migrate --check &&
                    celery -A rick_and_morty_api beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    volumes:
      - ./:/code
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    env_file:
      - .env

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5555:5555"
    command: sh -c "python manage.py wait_for_db && celery -A rick_and_morty_api flower --address=0.0.0.0 --port=5555"
    volumes:
      - ./:/code
    depends_on:
      celery:
        condition: service_started
      redis:
        condition: service_healthy
    restart: on-failure
    env_file:
      - .env

volumes:
  postgres_data: